name: Actualizar plugins

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (minuto 17)
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-plugins
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar mi repo
        uses: actions/checkout@v5

      - name: Filtrar plugins y verificar huellas
        run: |
          python3 - <<'PY'
          import json, sys, hashlib, urllib.request

          DEFAULT = "https://raw.githubusercontent.com/redblacker8/storm-ext/builds/plugins.json"

          def bajar(url, timeout=120):
              req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          # Leer lista.txt: [url] abre una sección; los nombres sin sección van al repo por defecto
          sections, current = {}, DEFAULT
          with open("lista.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if line.startswith("[") and line.endswith("]"):
                      current = line[1:-1].strip()
                      sections.setdefault(current, [])
                      continue
                  sections.setdefault(current, []).append(line)

          result, seen, errores = [], set(), 0
          for url, wanted in sections.items():
              if not wanted:
                  continue
              try:
                  data = json.loads(bajar(url, 60).decode("utf-8"))
              except Exception as e:
                  print(f"::error::No se pudo leer {url}: {e}")
                  errores += 1
                  continue
              by_name = {p.get("internalName"): p for p in data}
              for n in wanted:
                  if n not in by_name:
                      print(f"::warning::'{n}' no está en {url}")
                  elif n in seen:
                      print(f"::warning::'{n}' está repetido en otra fuente, se usa el primero")
                  else:
                      result.append(by_name[n]); seen.add(n)

          # Si alguna fuente falló, no se toca plugins.json (para no perder plugins)
          if errores or not result:
              print("::error::Hubo fuentes con error o el filtro quedó vacío, no se modifica plugins.json")
              sys.exit(1)

          # Verificar la huella de cada .cs3 contra el archivo que se sirve realmente
          corregidos = 0
          for p in result:
              try:
                  real = "sha256-" + hashlib.sha256(bajar(p["url"])).hexdigest()
              except Exception as e:
                  print(f"::warning::No se pudo verificar {p.get('internalName')}: {e}")
                  continue
              if p.get("fileHash") and p["fileHash"] != real:
                  print(f"Huella corregida: {p.get('internalName')}")
                  p["fileHash"] = real
                  corregidos += 1

          with open("plugins.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=4, ensure_ascii=False)
              f.write("\n")
          print(f"{len(result)} plugins guardados de {len([s for s in sections.values() if s])} fuentes, {corregidos} huellas corregidas")
          PY

      - name: Guardar cambios (solo si hubo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          if git diff --cached --quiet; then
            echo "Sin cambios, todo al día."
          else
            git commit -m "Actualizar plugins"
            git push
          fi
